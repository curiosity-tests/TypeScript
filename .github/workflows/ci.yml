  go-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - uses: ./.github/actions/setup-go
    - name: Prepare standalone tsc module
      run: |
        mkdir "$RUNNER_TEMP/go-test-bin"
        ln -s "$(go env GOROOT)/bin/go" "$RUNNER_TEMP/go-test-bin/go"
        cp -R tsc "$RUNNER_TEMP/tsc"
    - name: Tests without Node.js
      run: |
        export PATH="$RUNNER_TEMP/go-test-bin"
        export GOEXPERIMENT=ms_nocgo_opensslcrypto
        export CGO_ENABLED=0
        ! command -v node
        cd "$RUNNER_TEMP/tsc"
        go test ./...
        go test -run=- -bench=. -benchtime=1x ./...

    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

