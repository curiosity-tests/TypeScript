  test:
    strategy:
      fail-fast: false
      matrix:
        config:
        - runner: ubuntu-latest
          os: linux
          coverage: true
          main: true
        - runner: ubuntu-latest
          os: linux
          name: 'noembed'
          noembed: true
        - runner: ubuntu-latest
          os: linux
          name: 'concurrent test programs'
          concurrent-test-programs: true
          coverage: true
          skip: ${{ 'push' == 'merge_group' }}
        exclude:
        - config:
            skip: true

    name: test (${{ matrix.config.name || matrix.config.runner }})
    runs-on: ${{ matrix.config.runner }}
    permissions:
      id-token: write
      contents: read
    env:
      TSGO_HEREBY_RACE: ${{ (matrix.config.race && 'true') || 'false' }}
      TSGO_HEREBY_NOEMBED: ${{ (matrix.config.noembed && 'true') || 'false' }}
      TSGO_HEREBY_CONCURRENT_TEST_PROGRAMS: ${{ (matrix.config.concurrent-test-programs && 'true') || 'false' }}
      TSGO_HEREBY_COVERAGE: ${{ (matrix.config.coverage && 'push' != 'merge_group' && 'true') || 'false' }}
    steps:
    - run: git config --system core.longpaths true
      if: ${{ matrix.config.os == 'windows' }}
    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020   # v7.0.0
      with:
        node-version: 'lts/*'
    - uses: ./.github/actions/setup-go
    - if: ${{ !matrix.config.main }}
      name: Disable PR annotations
      run: |
        echo "::remove-matcher owner=eslint-compact::"
        echo "::remove-matcher owner=eslint-stylish::"
        echo "::remove-matcher owner=tsc::"
        echo "::remove-matcher owner=go::"
    - run: npm ci
    - run: go install gotest.tools/gotestsum@latest
      if: ${{ matrix.config.os != 'windows' && !matrix.config.race }}
    - name: Tests
      id: test
      run: npx hereby test:tsc
    - name: Benchmarks
      run: npx hereby test:benchmarks
    - run: git add .
    - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f   # v7.0.0
      if: ${{ always() && matrix.config.coverage && 'push' != 'merge_group' }}
      with:
        use_oidc: ${{ !('push' == 'pull_request' && github.event.pull_request.head.repo.fork) }}
        name: ${{ matrix.config.name || matrix.config.runner }}
        directory: ./coverage
    - run: git diff --staged --exit-code --stat
    - name: Print baseline diff on failure
      if: ${{ failure() && steps.test.conclusion == 'failure' }}
      run: |
        npx hereby baseline-accept
        git add tsc/testdata/baselines/reference
        git diff --staged --exit-code
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
      if: ${{ failure() && steps.test.conclusion == 'failure' }}
      with:
        name: ${{ matrix.config.name || matrix.config.os }}-new-baselines
        path: tsc/testdata/baselines/local

    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
